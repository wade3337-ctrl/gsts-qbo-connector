<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Authorization received</title><style>body{font-family:system-ui,Arial,sans-serif;max-width:720px;margin:40px auto;padding:0 18px;line-height:1.5}.box{background:#f0fff4;border:1px solid #0a7d3b;padding:14px 16px;border-radius:8px;margin:12px 0}code{word-break:break-all;background:#f4f4f4;padding:3px 6px;border-radius:4px;display:inline-block;margin-top:4px}h1{font-size:1.4rem}</style></head><body><h1>Authorization received ✅</h1><p>Copy these two values and send them to Gilligan:</p><div class="box"><strong>Authorization code</strong><br><code id="code">(none)</code></div><div class="box"><strong>Realm ID (Company ID)</strong><br><code id="realm">(none)</code></div><p id="meta" style="color:#888;font-size:.9rem"></p><script>var p=new URLSearchParams(window.location.search);document.getElementById('code').textContent=p.get('code')||'(missing)';document.getElementById('realm').textContent=p.get('realmId')||'(missing)';document.getElementById('meta').textContent='state: '+(p.get('state')||'(none)')+(p.get('error')?('  |  ERROR: '+p.get('error')+' '+(p.get('error_description')||'')):'');</script></body></html>
